name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clients_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Interface — installation, tests et compilation
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: API — tests H2 et JAR complet
        run: ./mvnw -B --no-transfer-progress -P'!frontend' verify
      - name: API — mêmes tests avec PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clients_test
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test-only-password
        run: ./mvnw -B --no-transfer-progress -P'!frontend' test
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: liste-clients:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Démarrage du conteneur et vérification HTTP
        run: |
          docker run -d --name clients -p 8080:8080 liste-clients:test
          trap 'docker logs clients; docker rm -f clients' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 http://localhost:8080/actuator/health
          curl --fail http://localhost:8080/ | grep -q 'Liste de clients'
          curl --fail http://localhost:8080/api/clients | grep -q 'Exemple'
